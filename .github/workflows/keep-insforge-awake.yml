name: Keep InsForge awake

# InsForge pausa los proyectos Free tras 1 semana sin actividad.
# Este workflow hace ping diariamente para que el backend nunca llegue al límite.
#
# Nota: en repositorios públicos GitHub desactiva los workflows programados
# tras 60 días sin actividad en el repositorio. Si el repo va a estar inactivo
# mucho tiempo, conviene además un monitor externo (UptimeRobot, cron-job.org)
# o un schedule de pg_cron dentro de InsForge.
on:
  schedule:
    # 06:00 UTC todos los días (01:00 en Perú, UTC-5)
    - cron: '0 6 * * *'
    # Respaldo diario a distinta hora (18:00 UTC / 13:00 Perú)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-insforge-awake
  cancel-in-progress: false

jobs:
  ping:
    name: Ping backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          set -euo pipefail
          url="https://vph97w7w.us-west.insforge.app/api/health"
          body="$(curl -fsS --max-time 30 --retry 3 --retry-delay 10 "$url")"
          echo "Respuesta: $body"
          echo "$body" | jq -e '.status == "ok"' > /dev/null

      - name: Database activity
        env:
          INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${INSFORGE_ANON_KEY:-}" ]; then
            echo "INSFORGE_ANON_KEY no configurada: se omite el ping a la base de datos."
            exit 0
          fi
          url="https://vph97w7w.us-west.insforge.app/api/database/records/profiles?select=id&limit=1"
          # Se envían apikey y Authorization: el ping debe llegar a Postgres,
          # no quedarse en un 401 del middleware de autenticación.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $INSFORGE_ANON_KEY" \
            -H "Authorization: Bearer $INSFORGE_ANON_KEY" \
            "$url")"
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "El ping a la base de datos falló (HTTP $code)."
            exit 1
          fi
          echo "Base de datos activa."
