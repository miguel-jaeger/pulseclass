<!doctype html>
<html class="h-full splash-active" lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('pulseclass_theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
        window.__pulseclassSplashStart = Date.now()
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141d23" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseClass - Satisfacción Estudiantil</title>
    <style>
      :root {
        --splash-bg: #ffffff;
      }
      html.splash-active,
      html.splash-active body {
        background: var(--splash-bg);
      }
      #splash {
        position: fixed;
        inset: -1px;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
      }
      #splash svg {
        width: 11rem;
        height: auto;
      }
      @media (min-width: 768px) {
        #splash svg {
          width: 13rem;
        }
      }
      @media (display-mode: standalone), (display-mode: minimal-ui), (display-mode: fullscreen) {
        #splash {
          padding-bottom: 4.8vh;
        }
        #splash svg {
          width: 12rem;
        }
      }
      @keyframes splash-glint {
        0% { stroke-dashoffset: 426; }
        70% { stroke-dashoffset: 184; }
        100% { stroke-dashoffset: 184; }
      }
      #splash .glint {
        animation: splash-glint 1.6s linear infinite;
      }
    </style>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>

  </head>
